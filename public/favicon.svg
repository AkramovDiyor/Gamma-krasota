<!-- public/favicon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Градиентный фон -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFF3B0"/>
      <stop offset="100%" stop-color="#E6C200"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Тёмный фон -->
  <circle cx="32" cy="32" r="31" fill="#0a0a0a"/>
  
  <!-- Свечение -->
  <circle cx="32" cy="32" r="28" fill="url(#glow)"/>
  
  <!-- Буква Г (золотая) -->
  <text x="32" y="42" font-family="Montserrat, sans-serif" font-weight="900" font-size="36" 
        fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-1">Г</text>
  
  <!-- Золотая рамка -->
  <circle cx="32" cy="32" r="30.5" stroke="url(#goldGrad)" stroke-width="1" fill="none"/>
</svg>